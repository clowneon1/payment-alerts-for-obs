<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamPe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #131315;
      color: #e5e1e4;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
      overflow: hidden;
      letter-spacing: -0.01em;
    }
    .logo-container {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(145, 70, 255, 0.15), rgba(0, 244, 254, 0.15));
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
    }
    .logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 8px;
    }
    @-webkit-keyframes spin {
      0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
    }
    @keyframes spin {
      0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(145, 70, 255, 0.18);
      border-top-color: #9146ff;
      border-right-color: #d5baff;
      border-radius: 50%;
      -webkit-animation: spin 0.8s linear infinite;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    .title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .subtext {
      font-size: 11px;
      color: #adadb8;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="/icon.png" alt="StreamPe" class="logo-img" />
  </div>
  <div class="spinner"></div>
  <div class="title">StreamPe</div>
  <div class="subtext">Starting background server...</div>
</body>
</html>
