<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamPe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
      overflow: hidden;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 16px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.5px; }
    .subtext { font-size: 12px; color: #64748b; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">StreamPe</div>
  <div class="subtext">Starting background server...</div>
</body>
</html>
